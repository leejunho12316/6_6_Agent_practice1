server {
    listen 80; # 80포트로 들어오는 요청 수신
    location / {
        proxy_pass http://agent:8080;
        # docker-compose 내부에서 서비스 이름(agent)으로 통신 가능
        proxy_set_header Host $host;
        # 원래 요청의 Host 헤더를 그대로 전달
        proxy_set_header X-Real-IP $remote_addr;
        # 클라이언트 실제 IP를 헤더에 담아 전달
    }
}